services:
  - type: web
    name: autostore-ai
    runtime: node
    plan: free
    # app/index.html is committed, so no Python build step is needed here.
    buildCommand: ""
    startCommand: node server.js
    envVars:
      # Set the value in the Render dashboard — never commit the key.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-pro
      - key: OPENROUTER_REASONING
        value: medium
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"
